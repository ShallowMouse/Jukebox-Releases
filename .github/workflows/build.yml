name: release
# Builds Windows + Linux, then publishes one release in this repo with every file.
# The app's auto-updater reads latest.yml / latest-linux.yml from the newest release.
# Runs only when you push a version tag (e.g. `git tag v1.2.2 && git push --tags`) or press
# "Run workflow" in the Actions tab (uses the version in package.json), so ordinary commits don't build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(node -p "require('./package.json').version"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: --win, name: windows }
          - { os: ubuntu-latest, target: --linux, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish release
        run: |
          V="${{ needs.prepare.outputs.version }}"
          ls -la out
          # re-running a version replaces it: remove any earlier release (or stray draft) with this tag
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name==\"v$V\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            git tag "v$V" && git push origin "v$V"
          fi
          notes=$(git log -1 --pretty=%B | sed '/^Co-Authored-By/d;/^Claude-Session/d')
          gh release create "v$V" out/* --repo "$GITHUB_REPOSITORY" --title "Jukebox $V" --notes "$notes" --latest
