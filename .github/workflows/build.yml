name: release
# Builds Windows + Linux and publishes them as a release of this repo,
# where the app's auto-updater picks them up.
# Runs only when you push a version tag (e.g. `git tag v1.2.1 && git push --tags`) or press
# "Run workflow" in the Actions tab (uses the version in package.json), so ordinary commits don't build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(node -p "require('./package.json').version"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # GitHub only publishes releases whose tag already exists
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            git tag "v$V" && git push origin "v$V"
          fi
          # Re-running a version: turn its release back into a draft so the builds can replace the files
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --draft=true
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npx electron-builder --win --publish always

  linux:
    needs: [prepare, windows]   # one after the other so both add files to the same draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npx electron-builder --linux --publish always

  publish:
    needs: [prepare, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft so jukeboxes can update
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest --title "Jukebox ${{ needs.prepare.outputs.version }}"
