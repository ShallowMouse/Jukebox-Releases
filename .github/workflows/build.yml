name: release
# Builds Windows + Linux and publishes them to github.com/ShallowMouse/jukebox-releases,
# where the app's auto-updater picks them up.
# Runs only when you push a version tag (e.g. `git tag v1.2.1 && git push --tags`) or start it by hand,
# so ordinary commits don't trigger a build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Publishing to another repo needs a token with Contents: write on jukebox-releases (RELEASES_TOKEN).
  # If this workflow lives in jukebox-releases itself, the built-in token is enough.
  GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npx electron-builder --win --publish always

  linux:
    needs: windows   # one after the other so both add files to the same release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npx electron-builder --linux --publish always
